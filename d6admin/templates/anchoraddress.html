<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D6 Anchor Address Management</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 40px; }
        .card { background: #1e293b; padding: 30px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #7dd3fc; }
        .back-link { display: inline-block; margin-top: 15px; color: #38bdf8; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Anchor Address Management</h1>
        <p>Configure and verify anchor parcel locations for regional routing and hazard assessments.</p>
        
        <form method="POST" action="/d6/anchoraddress/save">
            <div class="form-group">
                <label for="anchor_name">Anchor Label / Name:</label>
                <input type="text" id="anchor_name" name="anchor_name" placeholder="e.g., Costilla Hub Primary" required>
            </div>
            <div class="form-group">
                <label for="coordinates">Coordinates or Legal Description:</label>
                <input type="text" id="coordinates" name="coordinates" placeholder="e.g., Unit G-2, Blk 216, Lot 4265">
            </div>
            <button type="submit">Save Anchor Address</button>
        </form>

        <a href="/" class="back-link">&larr; Back to D6 Admin Hub</a>
    </div>
</body>
</html>
