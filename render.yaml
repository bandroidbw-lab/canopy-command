services:
  - type: web
    name: canopy-command-d4-dialer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: /opt/render/project/src/.venv/bin/gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
  - type: web
    name: canopy-command-d6-admin
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: /opt/render/project/src/.venv/bin/gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0