<!-- AI Script & Voice Editor Card -->
<div class="card">
    <h2>AI Voice & Script Editor</h2>
    <p style="color: #94a3b8; font-size: 14px;">Configure natural AI voice generation and outbound broadcaster dialogue templates.</p>
    
    <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">AI Persona / Tone</label>
        <input type="text" id="ai-persona" value="Energetic Tree Care Specialist" style="width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">Voice Model</label>
        <select id="voice-model" style="width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 4px;">
            <option value="en-US-Neural2-F">en-US-Neural2-F (High Energy & Natural)</option>
            <option value="en-US-Neural2-J">en-US-Neural2-J (Professional Baritone)</option>
            <option value="en-US-Wavenet-D">en-US-Wavenet-D (Warm Contractor Voice)</option>
        </select>
    </div>

    <div style="margin-bottom: 15px;">
        <label style="display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">Broadcast Script Template (Supports {contractor_name}, {corridor})</label>
        <textarea id="script-template" rows="4" style="width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 4px;">Hello {contractor_name}, this is Canopy Command. We noticed your tree service crew operating in the {corridor} corridor and wanted to secure your spot for our upcoming high-density prime contractor quota.</textarea>
    </div>

    <button class="btn btn-start" onclick="saveScript()">Save & Deploy Script</button>
    <span id="script-save-status" style="margin-left: 10px; font-size: 13px; color: #22c55e;"></span>
</div>

<script>
    async function saveScript() {
        const payload = {
            persona: document.getElementById('ai-persona').value,
            voice_model: document.getElementById('voice-model').value,
            script_template: document.getElementById('script-template').value
        };
        try {
            const res = await fetch('/api/broadcaster/script', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('script-save-status').innerText = "Script saved successfully!";
                setTimeout(() => { document.getElementById('script-save-status').innerText = ""; }, 3000);
            }
        } catch (err) {
            console.error("Failed to save script", err);
        }
    }
</script>
