<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canopy Command — Enterprise Operations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/darkly/bootstrap.min.css">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-surface: #111827;
            --border-subtle: #1f2937;
            --accent-gold: #f59e0b;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: -0.01em;
        }
        .navbar-custom {
            background-color: var(--bg-surface) !important;
            border-bottom: 1px solid var(--border-subtle);
        }
        .card-custom {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            transition: border-color 0.2s ease;
        }
        .card-custom:hover {
            border-color: var(--accent-gold);
        }
        .btn-gold {
            background-color: var(--accent-gold);
            color: #0b0f19;
            font-weight: 600;
            border: none;
        }
        .btn-gold:hover {
            background-color: #d97706;
            color: #0b0f19;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4 py-3">
        <a class="navbar-brand fw-bold text-light fs-5" href="/">
            <span style="color: var(--accent-gold);">🌲 Canopy</span> Command
        </a>
        <div class="ms-auto text-muted small">
            Enterprise Grid v4.2 | <span class="text-success fw-bold">● System Online</span>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 1200px;">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
