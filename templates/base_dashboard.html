<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canopy Command - {{ service_name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 25px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; }
        .badge { background: #0284c7; padding: 4px 10px; border-radius: 4px; font-size: 12px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #334155; margin: 8px 0; padding: 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Canopy Command Hub</h1>
        <div class="card">
            <h2>Service: <span style="color: #38bdf8;">{{ service_name }}</span> <span class="badge">Operational</span></h2>
            <p>Active directory and submodule management console.</p>
            <h3>Registered Submodules / Paths:</h3>
            <ul>
                {% for mod in modules %}
                <li>{{ mod }} <span>Active</span></li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
